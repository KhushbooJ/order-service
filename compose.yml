services:
  order-db:
    image: postgres:16
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: kj
      POSTGRES_PASSWORD: kj
    ports:
      - "5433:5432"
    volumes:
      - order-data:/var/lib/postgresql/data

  order-redis:
    image: redis:7
    ports:
      - "6379"

volumes:
  order-data: